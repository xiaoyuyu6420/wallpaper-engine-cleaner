[project]
name = "wecleaner"
version = "0.5.0"
description = "Wallpaper Engine wallpaper manager: view disk usage, batch-unsubscribe, clean Steam workshop leftovers, restore subscriptions"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "send2trash>=2.1.0",
]

[project.scripts]
wecleaner = "wecleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
